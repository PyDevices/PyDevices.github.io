<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script>try{if(localStorage.getItem('pydevices-theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyDevices Simulator — Interactive Python Device Playground</title>
    <meta name="description" content="Interactive browser-based Python playground for LVGL, pdwidgets, pygraphics, and displaydev on MicroPython and Pyodide.">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="simulator.css">
    <!-- LZ-String for compressed URL hash sharing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- Monaco Editor AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <!-- Top Global App Bar -->
    <header class="sim-header">
        <div class="sim-header-left">
            <a href="/" class="sim-brand" aria-label="PyDevices Home">
                <span class="sim-brand-title">PyDevices</span>
                <span class="sim-brand-badge">SIMULATOR</span>
            </a>
        </div>

        <div class="sim-header-center">
            <!-- Preset Template Selector -->
            <div class="sim-select-wrap">
                <select id="template-select" aria-label="Select Code Template">
                    <optgroup label="LVGL">
                        <option value="lvgl-counter" selected>LVGL: Interactive Counter</option>
                        <option value="lvgl-thermostat">LVGL: Smart Thermostat Arc</option>
                    </optgroup>
                    <optgroup label="pdwidgets">
                        <option value="pdwidgets-dashboard">pdwidgets: Sensor Deck Dashboard</option>
                    </optgroup>
                    <optgroup label="pygraphics">
                        <option value="pygraphics-shapes">pygraphics: Vector & FrameBuffer Art</option>
                    </optgroup>
                    <optgroup label="displaydev">
                        <option value="displaydev-raw">displaydev: Direct Pixel Painter</option>
                    </optgroup>
                </select>
            </div>

            <!-- Resolution & Shape Selector -->
            <div class="sim-select-wrap">
                <select id="resolution-select" aria-label="Select Screen Resolution">
                    <option value="320x240" selected>320 × 240 (QVGA Landscape)</option>
                    <option value="240x320">240 × 320 (QVGA Portrait)</option>
                    <option value="240x240-square">240 × 240 (Square Watch)</option>
                    <option value="240x240-round">240 × 240 (Round Watch)</option>
                    <option value="480x320">480 × 320 (HVGA Landscape)</option>
                    <option value="320x480">320 × 480 (HVGA Portrait)</option>
                    <option value="800x480">800 × 480 (WVGA Landscape)</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>

            <!-- Runtime Engine Selector -->
            <div class="sim-select-wrap">
                <select id="runtime-select" aria-label="Select Execution Runtime">
                    <option value="pyodide" selected>Pyodide (CPython)</option>
                    <option value="mpy">MicroPython</option>
                </select>
            </div>
        </div>

        <div class="sim-header-right">
            <!-- Run / Restart Button -->
            <button type="button" class="sim-btn sim-btn-primary" id="run-btn" title="Run Script (Ctrl+Enter)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Run</span>
                <kbd>Ctrl+↵</kbd>
            </button>

            <!-- Share URL Button -->
            <button type="button" class="sim-btn" id="share-btn" title="Share Interactive Code Link">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                <span>Share</span>
            </button>

            <!-- Theme Toggle -->
            <button type="button" class="sim-btn sim-icon-btn" id="theme-toggle" aria-label="Toggle Color Theme" title="Toggle Light/Dark Theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Resizable Workspace -->
    <main class="sim-workspace" id="workspace">
        <!-- Left Pane: Monaco Code Editor -->
        <section class="sim-editor-pane" id="editor-pane" aria-label="Code Editor">
            <div class="sim-pane-header">
                <div class="sim-tab">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    <span>main.py</span>
                </div>
                <div class="sim-status-indicator">
                    <span class="sim-status-dot is-ready" id="status-dot"></span>
                    <span id="status-text">Ready</span>
                </div>
            </div>
            <div class="sim-editor-container" id="editor-container"></div>
        </section>

        <!-- Vertical Drag Splitter -->
        <div class="sim-splitter" id="splitter-v" role="separator" aria-orientation="vertical"></div>

        <!-- Right Pane: Simulator & Console -->
        <section class="sim-preview-pane" id="preview-pane" aria-label="Simulator and Console Output">
            <!-- Top Sub-Pane: Hardware Canvas Bezel Stage -->
            <div class="sim-device-stage" id="device-stage">
                <div class="sim-device-bezel" id="device-bezel">
                    <canvas id="display_canvas" width="320" height="240" tabindex="0"></canvas>
                    <canvas id="aux_canvas" width="1" height="1" tabindex="0"></canvas>
                </div>
            </div>

            <!-- Horizontal Drag Splitter -->
            <div class="sim-splitter-h" id="splitter-h" role="separator" aria-orientation="horizontal"></div>

            <!-- Bottom Sub-Pane: Interactive REPL -->
            <section class="sim-console-pane" id="console-pane" aria-label="Interactive Python REPL">
                <div class="sim-pane-header">
                    <div class="sim-tab">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                        <span>REPL</span>
                    </div>
                    <button type="button" class="sim-btn sim-icon-btn" id="clear-console-btn" title="Clear REPL Log">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
                <div class="sim-console-body" id="console-log"></div>
                <form class="sim-repl-form" id="repl-form" autocomplete="off">
                    <span class="sim-repl-prompt" id="repl-prompt">&gt;&gt;&gt;</span>
                    <input type="text" class="sim-repl-input" id="repl-input" placeholder="Type Python expression or command (e.g. dir(), lv.screen_active()...)" spellcheck="false" autocomplete="off" autocapitalize="off">
                </form>
            </section>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="sim-toast" id="sim-toast">✓ Link copied to clipboard!</div>

    <!-- Simulator Application Scripts -->
    <script src="./templates.js"></script>
    <script src="./simulator.js"></script>
</body>
</html>
