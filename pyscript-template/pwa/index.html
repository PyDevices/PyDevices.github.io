<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22c7e2">
  <title>My PyDevices App</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./vendor/pyscript/core.css">
  <script type="module" src="./vendor/pyscript/core.js"></script>
  <script defer src="./pwa.js"></script>

<body>
  <main>
    <p class="eyebrow">PyDevices · PyScript</p>

    <button type="button" id="install" hidden>Install app</button>
  </main>
  <script type="py" src="./main.py" config="./pyscript.json"></script>

</html>
