name: Deploy PyDevices Org Portal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PyDevices.github.io
        uses: actions/checkout@v4
        with:
          path: PyDevices.github.io

      - name: Checkout dotgithub
        uses: actions/checkout@v4
        with:
          repository: PyDevices/dotgithub
          path: dotgithub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Site & Sync Assets
        run: |
          python3 dotgithub/scripts/generate_sites.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'PyDevices.github.io/.site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
